<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recipe Book</title><style>
:root{--cream:#FAF5EC;--card:#FFFDF8;--ink:#211A12;--muted:#7A6F5F;--terra:#C2410C;--terra-d:#9A340A;--green:#2F4A33;--line:#E9DFCE;--soft:#F1E8D6;--pillbg:#FDEADF;--pilltext:#C2410C}
@media (prefers-color-scheme: dark){:root{--cream:#1C1917;--card:#292420;--ink:#F5EFE4;--muted:#A89E8C;--terra:#E8652F;--terra-d:#FF7A45;--green:#7FB069;--line:#3D362E;--soft:#3A332B;--pillbg:#3A2A22;--pilltext:#F0925A}}
[data-theme="light"]{--cream:#FAF5EC;--card:#FFFDF8;--ink:#211A12;--muted:#7A6F5F;--terra:#C2410C;--terra-d:#9A340A;--green:#2F4A33;--line:#E9DFCE;--soft:#F1E8D6;--pillbg:#FDEADF;--pilltext:#C2410C}
[data-theme="dark"]{--cream:#1C1917;--card:#292420;--ink:#F5EFE4;--muted:#A89E8C;--terra:#E8652F;--terra-d:#FF7A45;--green:#7FB069;--line:#3D362E;--soft:#3A332B;--pillbg:#3A2A22;--pilltext:#F0925A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--cream);padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h1{font-family:"Fraunces",Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.5px}
.top p{color:var(--muted);font-size:14px;margin-top:2px}
.theme{flex:none;font-size:14px;font-weight:700;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.search{margin-top:14px;display:flex;gap:8px}
.search input{flex:1;font-size:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--terra)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:6px 18px 40px}
.count{color:var(--muted);font-size:13px;padding:10px 0 4px}
.section-title{font-family:"Fraunces",Georgia,serif;font-size:22px;margin:26px 0 2px}
.section-sub{color:var(--muted);font-size:14px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.card:active{transform:scale(.985)}
.cardimg{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.hero{width:100%;border-radius:16px;margin:8px 0 4px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px}
.carousel img{flex:none;width:84%;max-height:440px;object-fit:cover;border-radius:14px;scroll-snap-align:center}
.carousel-hint{color:var(--muted);font-size:13px;margin:2px 0 6px}
.card .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pilltext);background:var(--pillbg);padding:5px 10px;border-radius:999px}
.card .pill.partial{background:var(--soft);color:var(--muted);margin-left:6px}
.card h2{font-family:"Fraunces",Georgia,serif;font-size:24px;line-height:1.15;margin:12px 0 6px}
.card .meta{color:var(--muted);font-size:14px}
.card .go{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.card .go span{font-weight:700;color:var(--terra)}
.card .go .openpost{background:var(--terra);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;font-size:14px}
.postbox{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.openpost.big{width:100%;padding:15px;font-size:16px;font-weight:700;background:var(--terra);color:#fff;border-radius:14px}
.copybtn{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;margin-top:10px}
.rawurl{font-size:12px;color:var(--muted);word-break:break-all;margin-top:10px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}
.detail{display:none}
.detail .back{font-weight:700;font-size:15px;padding:6px 0;color:var(--terra)}
.detail h2{font-family:"Fraunces",Georgia,serif;font-size:32px;line-height:1.1;margin:14px 0 6px}
.detail .src{color:var(--muted);font-size:14px}
.detail .src a{color:var(--terra);font-weight:700;text-decoration:none}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);margin:14px 0}
h3{font-family:"Fraunces",Georgia,serif;font-size:21px;margin:22px 0 10px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.prog-label{font-size:13px;color:var(--muted);margin-bottom:4px}
.ing{list-style:none}
.ing li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;cursor:pointer;font-size:17px;line-height:1.4}
.ing li.done{opacity:.45}
.ing li.done .txt{text-decoration:line-through}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.ing li.done .box{background:var(--green);border-color:var(--green)}
.ing-plain{list-style:none}
.ing-plain li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;font-size:17px;line-height:1.4}
.steps{list-style:none;counter-reset:s}
.steps li{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;font-size:17px;line-height:1.55}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.start{width:100%;padding:18px;border-radius:16px;background:var(--terra);color:#fff;font-size:19px;font-weight:700;margin:22px 0 8px}
.start:active{background:var(--terra-d)}
.cook{position:fixed;inset:0;background:var(--cream);z-index:50;display:none;flex-direction:column}
.cook .chead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.cook .chead button{font-weight:700;color:var(--terra);font-size:15px}
.cook .cbody{flex:1;overflow:auto;padding:28px 22px 140px;max-width:720px;width:100%;margin:0 auto}
.cook .steplabel{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.cook .steptext{font-family:"Fraunces",Georgia,serif;font-size:31px;line-height:1.25;margin:14px 0 6px}
.cook .cfoot{position:fixed;bottom:0;left:0;right:0;background:var(--cream);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px}
.cook .cfoot button{flex:1;padding:17px;border-radius:14px;font-size:17px;font-weight:700}
.cook .prev{background:var(--card);border:1.5px solid var(--line)}
.cook .next{background:var(--terra);color:#fff}
.cook .next:disabled{opacity:.4}
.dots{display:flex;gap:6px;margin:18px 0}
.dots i{width:9px;height:9px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--terra)}
.done-wrap{text-align:center;padding:50px 20px}
.done-wrap .big{font-family:"Fraunces",Georgia,serif;font-size:34px}
.done-wrap p{color:var(--muted);margin:12px 0 24px;font-size:16px}
.originrow{display:flex;gap:8px;flex-wrap:wrap;padding:2px 16px 12px}.stepuses{font-size:12px;color:var(--muted);margin-top:6px}.cookneed{font-weight:700;margin:16px 0 8px;font-size:14px}.cookneed.none{font-weight:400;color:var(--muted)}.cookings{display:flex;flex-direction:column;gap:8px}.cooking{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.35}.cooking.done{opacity:.55}.cooking input{width:20px;height:20px;margin-top:1px;accent-color:var(--terra);flex:none}.cookall{margin-top:10px;font-size:13px;color:var(--green);font-weight:600}.cookprog{font-size:12px;color:var(--muted);align-self:center;flex:none;white-space:nowrap}.swipehint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}</style></head>
<body>
<div id="home">
  <div class="top"><div class="toprow"><div><h1>Recipe Book</h1><p>Tap one to cook it.</p></div>
    <button class="theme" id="themeBtn" onclick="toggleTheme()">Dark</button></div>
    <div class="search"><input id="q" type="search" placeholder="Search recipes, ingredients, or cooks…" autocomplete="off"></div>
  </div>
  <div class="chips" id="chips"></div><div class="originrow" id="originRow"></div>
  <div class="wrap"><div class="count" id="count"></div><div id="list"></div>
    <div id="moreSection"></div>
  </div>
</div>
<div id="detail" class="detail wrap"></div>
<div id="cook" class="cook"></div>
<script id="chunks" type="application/json">["data/recipes-0.json", "data/recipes-1.json", "data/recipes-2.json"]</script><script id="moredata" type="application/json">[{"title":"Scalloped Potatoes","source":"jose.elcook","url":"https://www.instagram.com/reel/DZ6ZZqiu-2M/","category":"Mains","note":"Ingredients written out, but no steps \u2014 follow the video for the method.","ingredients":["5 Yukon potatoes","4 oz butter","1/2 onion, diced","1 Tbsp kosher salt","5 cloves garlic, minced","1/4 cup flour","12 oz heavy cream","12 oz chicken stock","1 tsp chopped rosemary","1/2 tsp nutmeg","1/2 tsp cayenne pepper","1/2 cup shredded cheddar","Gruy\u00e8re cheese, for broiling","Chives, to garnish"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"Loaded Baked Potato Soup","source":"jose.elcook","url":"https://www.instagram.com/reel/DTfm2cDEX-G/","category":"Mains","note":"Ingredients written out (makes about 8 cups), but no steps \u2014 follow the video for the method.","ingredients":["10 slices thick-cut bacon, chopped","1 yellow onion, diced","4 celery stalks, diced","2 cloves garlic, minced","2 tsp salt","1/2 tsp black pepper","4 Tbsp unsalted butter","4 Tbsp flour","2.5 cups whole milk, warmed","1/2 cup heavy cream, warmed","3 cups chicken stock","3 russet potatoes, peeled and cut into 1/2-inch cubes","1/2 cup chopped green onion","1 cup grated medium cheddar cheese","Chives, to garnish","More cheese, to garnish","Black pepper, to garnish"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"Carne Asada Marinade","source":"big.eats.world","url":"https://www.instagram.com/reel/DCj7vu0yUPX/","category":"Mains","note":"Marinade ingredients only \u2014 no steps written out.","ingredients":["3 lbs flank steak or skirt","1/2 cup olive oil","1 tsp black pepper","1 tsp oregano","1 1/2 Tbsp salt","1 tsp cumin","1/2 Tbsp chili powder","1/2 Tbsp garlic powder","1/2 Tbsp onion powder","Juice of 2 lemons","Juice of 2 oranges","Small bunch of cilantro","Half a white onion"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"Chipotle Honey Vinaigrette","source":"iankyo","url":"https://www.instagram.com/reel/C5dxUcEr7wG/","category":"Sauces & Dips","note":"Ingredients only \u2014 no steps written out.","ingredients":["Red wine vinegar (1 cup)","Honey (1/4 cup)","Neutral oil (3/4 cup)","Chipotle peppers (3-4)","Garlic (3 cloves)","Dried oregano (1 tsp)","Salt (to taste)","Pepper (to taste)"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"Chicken Katsu","source":"jose.elcook","url":"https://www.instagram.com/reel/C6oyjq4AXte/","category":"Mains","note":"Only the sauce is written out \u2014 the full katsu recipe is not in the post.","ingredients":["3 Tbsp ketchup","1 Tbsp oyster sauce","2 tsp Worcestershire","1 1/2 Tbsp sugar"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"3 Chicken Marinades","source":"2tfitness","url":"https://www.instagram.com/reel/C9NUbLLvhH9/","category":"Mains","note":"Marinade components named, no amounts or steps. Caption says: oven at 400\u00b0F for 30\u201340 mins.","ingredients":["Garlic Parm Marinade: olive oil, white wine vinegar, garlic powder, dried oregano, onion powder, crushed red pepper, truffle salt (or normal salt), pepper, honey, grated Parmesan","Sweet Marinade: olive oil, balsamic, soy sauce, Worcestershire, salt, pepper, garlic, rosemary, light brown sugar, lemon, Dijon mustard","Tomato Marinade: olive oil, tomato paste, lemon zest, lemon juice, garlic, salt, pepper, smoked paprika, oregano, thyme, cayenne"],"origin":"social","cover_data":"","gallery_data":[]},{"title":"Modular Cooking","source":"forkthepeople","url":"https://www.instagram.com/reel/DDiPi5so8bI/","category":"Techniques","note":"Technique explainer \u2014 how simple ingredient changes create whole new dishes. No recipe written out.","ingredients":[],"origin":"social","cover_data":"","gallery_data":[]},{"title":"How to Tell If Your Cookies Will Spread","source":"halfbatchbaking","url":"https://www.instagram.com/reel/C2dpWK-xpEy/","category":"Techniques","note":"Baking-science explainer \u2014 how fat/sugar/flour ratios and mixing method affect cookie spread. No recipe written out.","ingredients":[],"origin":"social","cover_data":"","gallery_data":[]}]</script><script>
const MORE = JSON.parse(document.getElementById('moredata').textContent);
const CATS = ['All','Mains','Crockpot','Sauces & Dips','Baking','Breakfast','Drinks','Pantry','Techniques'];
let R = [];
let cat = 'All', origin = 'All', sel = null, checked = new Set(), step = 0;
const ORIGINS = [['All','All recipes'],['social','Social media'],['parents','From my parents'],['mine','My notes']];
function renderOrigin(){
  $('#originRow').innerHTML = ORIGINS.map(o => `<button class="chip ${o[0]===origin?'on':''}" onclick="setOrigin('${o[0]}')">${o[1]}</button>`).join('');
}
function setOrigin(o){ origin = o; renderOrigin(); renderList(); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function effTheme(){ return document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function updateThemeBtn(){ $('#themeBtn').textContent = effTheme() === 'dark' ? 'Light' : 'Dark'; }
function toggleTheme(){ const t = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('rb-theme', t); }catch(e){} updateThemeBtn(); }
try{ const saved = localStorage.getItem('rb-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}
updateThemeBtn();
function q(){ return $('#q').value.trim().toLowerCase(); }
function matchItem(r){ return (cat === 'All' || r.category === cat) && (origin === 'All' || r.origin === origin) && (!q() || (r.title + ' ' + (r.ingredients||[]).join(' ') + ' ' + r.source + ' ' + (r.note||'')).toLowerCase().includes(q())); }
function renderChips(){
  $('#chips').innerHTML = CATS.map(c => `<button class="chip ${c===cat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){ cat = c; renderChips(); renderList(); }
function slug(t){ return String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function hashFor(){
  if (!sel) return '';
  const p = new URLSearchParams();
  p.set(sel._kind === 'recipe' ? 'recipe' : 'save', slug(sel.title));
  if ($('#cook').style.display === 'flex') p.set('step', String(step));
  return '#' + p.toString();
}
function setHash(){
  const h = hashFor();
  if (location.hash !== h){
    if (h) location.hash = h;
    else history.replaceState(null, '', location.pathname);
  }
}
function parseHash(){
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const p = new URLSearchParams(h);
  const rk = p.get('recipe'), sk = p.get('save');
  if (rk){ const i = R.findIndex(r => slug(r.title) === rk); if (i >= 0) return {i, kind:'recipe', step: p.get('step')}; }
  if (sk){ const i = MORE.findIndex(r => slug(r.title) === sk); if (i >= 0) return {i, kind:'more', step: null}; }
  return null;
}
function syncFromHash(){
  const t = parseHash();
  if (!t){ if (sel) goHome(true); return; }
  const target = t.kind === 'recipe' ? R[t.i] : MORE[t.i];
  if (sel && sel._kind === t.kind && slug(sel.title) === slug(target.title)){
    if (t.step !== null && sel._kind === 'recipe'){
      const s = parseInt(t.step, 10);
      if (!isNaN(s) && s >= 0 && s <= sel.instructions.length){
        if ($('#cook').style.display !== 'flex'){ step = s; renderCook(); $('#cook').style.display = 'flex'; }
        else if (step !== s){ step = s; renderCook(); }
      }
    } else if ($('#cook').style.display === 'flex'){
      $('#cook').style.display = 'none';
    }
    return;
  }
  openItem(t.i, t.kind, true);
  if (t.step !== null && t.kind === 'recipe'){
    const s = parseInt(t.step, 10);
    if (!isNaN(s) && s >= 0 && s <= sel.instructions.length){ step = s; renderCook(); $('#cook').style.display = 'flex'; }
  }
}
function srcLabel(r){
  if (r.url && r.url.includes('instagram.com')) return 'From @' + esc(r.source);
  if (r.source) return 'Recipe by ' + esc(r.source);
  return 'From your recipe collection';
}
function cardHtml(r, kind, idx){
  const srcPart = r.url && r.url.includes('instagram.com') ? '@' + esc(r.source) + ' &middot; ' : (r.source ? esc(r.source) + ' &middot; ' : '');
  const meta = [];
  if (r.ingredients && r.ingredients.length) meta.push(r.ingredients.length + ' ingredients');
  if (r.instructions && r.instructions.length) meta.push(r.instructions.length + ' steps');
  const sub = kind === 'recipe'
    ? `<div class="meta">${srcPart}${meta.join(' &middot; ')}</div><div class="go"><span>Start cooking</span><span class="arrow">&rarr;</span></div>`
    : `<div class="meta">${srcPart}${esc(r.note)}</div><div class="go"><span>See details</span><button class="openpost" onclick="event.stopPropagation(); openPost('${r.url}')">Open post ↗</button></div>`;
  const pill2 = kind === 'recipe' ? (r.partial ? '<span class="pill partial">Partial recipe</span>' : '') : '<span class="pill partial">No full recipe</span>';
  const img = r.cover_data ? `<img class="cardimg" src="${r.cover_data}" alt="" onerror="this.style.display='none'">` : '';
  return `<div class="card" onclick="openItem(${idx}, '${kind}')">${img}<span class="pill">${esc(r.category)}</span>${pill2}<h2>${esc(r.title)}</h2>${sub}</div>`;
}
function renderList(){
  const list = R.filter(matchItem), more = MORE.filter(matchItem);
  $('#count').textContent = list.length + (list.length === 1 ? ' recipe' : ' recipes') + (more.length ? ' + ' + more.length + ' more from your saves' : '');
  $('#list').innerHTML = list.length ? list.map(r => cardHtml(r, 'recipe', R.indexOf(r))).join('') : '<div class="empty">Nothing matches. Try another search.</div>';
  $('#moreSection').innerHTML = more.length ? `<div class="section-title">More from your saves</div><div class="section-sub">No full recipe written out — but the post may still be worth a look.</div>` + more.map(r => cardHtml(r, 'more', MORE.indexOf(r))).join('') : '';
}
function openItem(i, kind, fromHash){
  sel = (kind === 'recipe' ? R[i] : MORE[i]); sel._kind = kind; checked = new Set(); step = 0;
  $('#cook').style.display = 'none';
  $('#home').style.display = 'none';
  const d = $('#detail'); d.style.display = 'block';
  let body = `<button class="back" onclick="goHome()">&larr; All recipes</button>
    <h2>${esc(sel.title)}</h2>
    <div class="src">${srcLabel(sel)}</div>
    ${(sel.time || sel.servings) ? `<div class="src">${[sel.time ? '⏱ ' + esc(sel.time) : '', sel.servings ? esc(sel.servings) : ''].filter(Boolean).join(' &middot; ')}</div>` : ''}
    ${sel.cover_data ? `<img class="hero" src="${sel.cover_data}" alt="" onerror="this.style.display='none'">` : ''}
    ${sel.url ? `<div class="postbox">
      <button class="openpost big" onclick="openPost('${sel.url}')">${sel.url.includes('instagram.com') ? 'Open original post ↗' : 'Open original recipe ↗'}</button>
      <button class="copybtn" onclick="copyLink('${sel.url}', this)">Copy link</button>
      <div class="rawurl">${esc(sel.url)}</div>
    </div>` : ''}
    ${sel.cover_data ? '' : (sel.url ? `<div class="note">${sel.url.includes('instagram.com') ? 'Photos live on the original post — tap through to see them.' : 'Photos live on the original recipe page — tap through to see them.'}</div>` : '')}
    ${(sel.gallery_data && sel.gallery_data.length) ? `<h3>Photos</h3><div class="carousel-hint">Swipe to see more</div><div class="carousel">${sel.gallery_data.map(g => `<img src="${g}" alt="" onerror="this.style.display='none'">`).join('')}</div>` : ''}`;
  if (kind === 'recipe'){
    body += `${sel.partial ? '<div class="note">Partial recipe — the post doesn&rsquo;t spell out every step, so check the original post for the rest.</div>' : ''}`;
    if (sel.ingredients && sel.ingredients.length){
      body += `<h3>Ingredients</h3>
      <div class="prog-label" id="progLabel"></div><div class="prog"><i id="progBar"></i></div>
      <ul class="ing" id="ingList"></ul>`;
    }
    if (sel.instructions && sel.instructions.length){
      body += `<button class="start" onclick="startCook()">Start cooking &rarr;</button>
      <h3>Steps</h3>
      <ol class="steps">${sel.instructions.map(s => { const u = stepIngs(sel, s); return `<li><span>${esc(s)}</span>${u.length ? `<div class="stepuses">Uses: ${u.map(i => esc(coreOf(sel.ingredients[i]).join(' '))).join(', ')}</div>` : ''}</li>`; }).join('')}</ol>`;
    }
  } else {
    body += `<div class="note">${esc(sel.note)}</div>`;
    if (sel.ingredients.length) body += `<h3>Ingredients (as written in the post)</h3><ul class="ing-plain">${sel.ingredients.map(g => `<li>${esc(g)}</li>`).join('')}</ul>`;
  }
  d.innerHTML = body;
  if (kind === 'recipe' && sel.ingredients && sel.ingredients.length) renderIng();
  window.scrollTo(0, 0);
  if (!fromHash) setHash();
}
function renderIng(){
  $('#ingList').innerHTML = sel.ingredients.map((g,i) => `
    <li class="${checked.has(i)?'done':''}" onclick="toggleIng(${i})"><span class="box">${checked.has(i)?'&check;':''}</span><span class="txt">${esc(g)}</span></li>`).join('');
  const n = checked.size, t = sel.ingredients.length;
  $('#progLabel').textContent = n === 0 ? 'Tap each ingredient as you gather it.' : n + ' of ' + t + ' gathered';
  $('#progBar').style.width = (t ? (n / t) * 100 : 0) + '%';
}
function toggleIng(i){ checked.has(i) ? checked.delete(i) : checked.add(i); renderIng(); if (sel && sel.instructions) renderCook(); }
function goHome(fromHash){
  $('#detail').style.display = 'none'; $('#cook').style.display = 'none'; $('#home').style.display = 'block';
  sel = null;
  window.scrollTo(0, 0);
  if (!fromHash) history.replaceState(null, '', location.pathname);
}
function startCook(){
  step = 0; renderCook(); $('#cook').style.display = 'flex'; setHash();
}

const MATCH_UNITS = new Set('cup cups tablespoon tablespoons tbsp tbs tbsps teaspoon teaspoons tsp tsps ounce ounces oz pound pounds lb lbs gram grams g kg ml l liter liters pinch dash clove cloves can cans package packages pkg slice slices piece pieces bunch bunches head heads stick sticks quart quarts pint pints gallon fluid fl jar jars bag bags box boxes container containers c'.split(' '));
const MATCH_PREP = new Set('chopped diced minced sliced grated shredded crushed ground fresh dried finely coarsely thinly roughly cubed halved quartered peeled washed rinsed drained softened melted beaten whisked cooked uncooked raw frozen thawed room temperature skinless boneless lean extra virgin light dark large small medium whole half halves cut into pieces strips cubes wedges rings optional or and to taste for garnish serving plus more divided separated at the a an of in on with per amount amounts rub toppings topping blend mix mixture style bowl mixing grill pan skillet sheet baking pot cooker slow crock nonstick seasoned whipped'.split(' '));
function isHeaderIng(ing){
  const t = ing.trim();
  return t.endsWith(':') || /^for the /i.test(t) || /^(ingredients?|directions?|instructions?|nutrition.*|notes?)$/i.test(t) || (/^[A-Z][A-Z&'-]{1,20}$/.test(t) && !/\d/.test(t) && !t.includes(' '));
}
function coreOf(ing){
  const s = ing.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9\s\/-]/g, ' ');
  return s.split(/\s+/).filter(w => w && !/^\d/.test(w) && !w.includes('/') && !/^[¼½¾⅓⅔⅛⅜⅝⅞.]+$/.test(w) && !MATCH_UNITS.has(w) && !MATCH_PREP.has(w));
}
function stepIngs(r, stepText){
  const st = ' ' + stepText.toLowerCase().replace(/[^a-z0-9\s]/g, ' ') + ' ';
  const hitWord = w => w && (st.includes(' ' + w + ' ') || st.includes(' ' + w.replace(/s$/, '') + ' ') || st.includes(' ' + w + 's '));
  const all = (r.ingredients || []).map((ing, i) => i).filter(i => !isHeaderIng(r.ingredients[i]));
  let pool = all;
  const sec = stepText.match(/^\s*([A-Za-z][A-Za-z ]{1,30}):/);
  if (sec) {
    const name = sec[1].toLowerCase().trim();
    const inSec = all.filter(i => r.ingredients[i].toLowerCase().startsWith(name + ':'));
    if (inSec.length) pool = inSec;
  }
  if (/\b(all (your |the |remaining )?ingredients|everything|the rest|remaining ingredients)\b/.test(stepText.toLowerCase()) || (r.instructions && r.instructions.length === 1)) {
    return pool;
  }
  const hits = [];
  pool.forEach(i => {
    const core = coreOf(r.ingredients[i]);
    if (!core.length) return;
    const words = core.filter(w => w.length >= 3);
    const matched = words.filter(hitWord);
    if (matched.length && (hitWord(core[0]) || hitWord(core[core.length - 1]) || matched.length / core.length >= 0.5)) hits.push({i, words: core});
  });
  return hits.filter(h => !hits.some(o => o !== h && o.words.length > h.words.length && h.words.every(w => o.words.includes(w)) && o.words.filter(w => !h.words.includes(w)).every(hitWord))).map(h => h.i);
}
function setupSwipe(){
  const el = $('#cook');
  let sx = 0, sy = 0, tracking = false;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive: true});
  el.addEventListener('touchend', e => {
    if (!tracking) return; tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && sel && sel.instructions) {
      if (dx < 0) cookNext(); else cookPrev();
    }
  }, {passive: true});
}
function renderCook(){
  const total = sel.instructions.length;
  const done = step >= total;
  const ings = done ? [] : stepIngs(sel, sel.instructions[step]);
  const allIn = ings.length > 0 && ings.every(i => checked.has(i));
  $('#cook').innerHTML = `
    <div class="chead"><span>${esc(sel.title)}</span><button onclick="exitCook()">Exit</button></div>
    ${done ? `<div class="cbody"><div class="done-wrap"><div class="big">You did it.</div><p>${esc(sel.title)} is ready. Enjoy!</p><button class="start" onclick="exitCook()">Back to recipe</button></div></div>`
    : `<div class="cbody">
        <div class="steplabel">Step ${step + 1} of ${total}</div>
        <div class="steptext">${esc(sel.instructions[step])}</div>
        ${ings.length ? `<div class="cookneed">Add these:</div><div class="cookings">${ings.map(i => `<label class="cooking ${checked.has(i)?'done':''}"><input type="checkbox" ${checked.has(i)?'checked':''} onchange="toggleIng(${i})"><span>${esc(sel.ingredients[i])}</span></label>`).join('')}</div>${allIn ? `<div class="cookall">All in — keep going.</div>` : ''}` : `<div class="cookneed none">No ingredients in this step.</div>`}
        <div class="dots">${sel.instructions.map((_,i) => `<i class="${i===step?'on':''}"></i>`).join('')}</div>
        <div class="swipehint">Swipe &larr; &rarr; to move between steps</div>
      </div>
      <div class="cfoot">
        <button class="prev" onclick="cookPrev()" ${step===0?'disabled':''}>&larr; Back</button>
        <span class="cookprog">${checked.size} of ${sel.ingredients.length} added</span>
        <button class="next" onclick="cookNext()">${step === total - 1 ? 'Finish &check;' : 'Next step &rarr;'}</button>
      </div>`}`;
}
function cookNext(){ step++; renderCook(); setHash(); }
function cookPrev(){ if (step > 0) { step--; renderCook(); setHash(); } }
function exitCook(){ $('#cook').style.display = 'none'; setHash(); }
function openPost(url){ window.location.href = url; }
function copyLink(url, btn){
  const done = () => { if (btn){ const t = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = t, 1500); } };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done)); }
  else fallbackCopy(url, done);
}
function fallbackCopy(url, done){
  const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta);
}
async function loadData(){
  try{
    const chunks = JSON.parse(document.getElementById('chunks').textContent);
    const parts = await Promise.all(chunks.map(u => fetch(u).then(r => { if (!r.ok) throw new Error('fetch failed'); return r.json(); })));
    R = parts.flat();
  }catch(e){
    $('#list').innerHTML = '<div class="empty">Couldn\'t load recipes. Check your connection and refresh.</div>';
    return;
  }
  renderList(); syncFromHash();
}
$('#q').addEventListener('input', renderList);
renderChips(); renderOrigin(); setupSwipe();
$('#list').innerHTML = '<div class="empty">Loading recipes…</div>';
loadData();
window.addEventListener('hashchange', syncFromHash);
</script></body></html>
